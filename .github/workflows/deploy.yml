name: Publicar simulador web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5

      - name: Probar núcleo web
        run: >-
          uv run --project web_app python -m unittest
          web_app.test_engine
          web_app.test_physics_core
          web_app.test_physics_pipeline
          web_app.test_physics_adapter
          web_app.test_three_vendor
          web_app.test_shinylive_smoke
          web_app.test_export_shinylive_smoke
          web_app.test_export_shinylive_app

      - name: Exportar sitio estático
        run: >-
          uv run --project web_app python web_app/export_shinylive_app.py
          --version "$GITHUB_SHA"

      - name: Probar sitio en Chrome
        run: >-
          uv run --project web_app --group dev python web_app/e2e_browser.py
          --site _site

      - name: Subir sitio para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
